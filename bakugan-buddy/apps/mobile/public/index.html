<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Preyas</title>
    <meta name="description" content="Your Bakugan companion, running on your own Mac." />

    <!-- Home Screen web app on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Preyas" />
    <meta name="theme-color" content="#EFE7D6" />
    <!--
      First paint. Keep this in step with themePrefs.ts (key preyas.theme,
      Auto, dark from 20:00 to 07:00) and with DAY.bg / NIGHT.bg / NIGHT.onSky.
      It runs before the body exists so the wrong theme never flashes.
    -->
    <script>
      (function () {
        var KEY = "preyas.theme";
        var choice = "auto";
        var nightByClock = true;
        var nightStart = "20:00";
        var nightEnd = "07:00";
        try {
          var raw = localStorage.getItem(KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed === "object") {
              if (parsed.choice === "light" || parsed.choice === "dark" || parsed.choice === "auto") choice = parsed.choice;
              if (typeof parsed.nightByClock === "boolean") nightByClock = parsed.nightByClock;
              if (typeof parsed.nightStart === "string") nightStart = parsed.nightStart;
              if (typeof parsed.nightEnd === "string") nightEnd = parsed.nightEnd;
            }
          }
        } catch (e) {}
        function minutes(value) {
          var match = /^(\d{1,2}):(\d{2})$/.exec(value);
          if (!match) return null;
          var hour = Number(match[1]);
          var minute = Number(match[2]);
          if (hour > 23 || minute > 59) return null;
          return hour * 60 + minute;
        }
        function inWindow(now) {
          var start = minutes(nightStart);
          var end = minutes(nightEnd);
          if (start === null || end === null || start === end) return false;
          var t = now.getHours() * 60 + now.getMinutes();
          if (start < end) return t >= start && t < end;
          return t >= start || t < end;
        }
        var systemDark = false;
        try {
          systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        var dark = choice === "dark" || (choice === "auto" && ((nightByClock && inWindow(new Date())) || systemDark));
        var root = document.documentElement;
        root.setAttribute("data-pz", dark ? "night" : "day");
        root.style.colorScheme = dark ? "dark" : "light";
        root.style.backgroundColor = dark ? "#12161B" : "#EFE7D6";
        root.style.color = dark ? "#EFE7D6" : "#16130F";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#12161B" : "#EFE7D6");
      })();
    </script>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/Inter-var.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/Oswald-var.woff2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <style>
      html {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #EFE7D6;
        color: #16130F;
        -webkit-text-size-adjust: 100%;
      }
      html[data-pz="night"] {
        color-scheme: dark;
      }
      html[data-pz="night"],
      html[data-pz="night"] body {
        background: #12161B;
        color: #EFE7D6;
      }
      /* The notch and the home bar are safe areas, not merely padding. */
      body {
        min-height: 100vh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }
      /* iOS zooms the page when an input has a font smaller than 16px. */
      input,
      textarea,
      select {
        font-size: 16px !important;
      }
      #root {
        display: flex;
        flex: 1 1 auto;
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {
            /* offline shell is optional; the app still works online */
          });
        });
      }
    </script>
    <!--
      Do not hardcode a module script here. Expo injects the Metro bundle
      scripts with the correct MIME type; a static /index.js request would
      fall back to this HTML page and fail as "module script served as text/html".
    -->
  </body>
</html>
