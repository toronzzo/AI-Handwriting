<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bakugan Buddy — Body Runtime</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #050505; font-family: system-ui, sans-serif; }
    #stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud {
      position: absolute; left: 12px; top: 12px; z-index: 2;
      font: 600 12px/1.4 ui-monospace, monospace;
      color: #f2f2f2; background: rgba(0,0,0,.45); padding: 8px 10px;
      border: 1px solid rgba(200,200,200,.25); pointer-events: none;
      white-space: pre;
    }
    #controls {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
      padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,.7));
    }
    #controls button {
      border: 1px solid rgba(200,200,200,.35); background: rgba(255,255,255,.08);
      color: #e8e8e8; padding: 8px 10px; font: 600 12px system-ui; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="body"></canvas>
    <div id="hud">fps — · emotion idle</div>
    <div id="controls">
      <button data-e="happy">happy</button>
      <button data-e="excited">excited</button>
      <button data-e="fierce">angry</button>
      <button data-e="sad">sad</button>
      <button data-e="listening">listen</button>
      <button data-e="thinking">think</button>
      <button data-e="surprised">surprise</button>
      <button data-e="determined">battle</button>
      <button data-e="calm">calm</button>
      <button data-a="react">react demo</button>
      <button data-a="talk">talk pulse</button>
      <button data-a="theme">cycle theme</button>
    </div>
  </div>
  <script>
/**
 * Bakugan Buddy — body runtime (M1 + anime realism)
 * Ground truth: docs/PREYAS_FROM_ANIME.md
 * Feelings live in motion + eye glow — no cartoon face on the sphere.
 *
 * Public API (window.BakuganBody):
 *   setEmotion(mood)
 *   setTheme(themeId | themeObject)
 *   setTalking(boolean | volume01)
 *   react("[mood] text")
 */
(function () {
  "use strict";

  const THEMES = {
    aquos: {
      id: "aquos",
      shell: "#c8c8c8",
      shellDeep: "#2a2a2a",
      accent: "#f2f2f2",
      accentHot: "#ffffff",
      core: "#e0e0e0",
      eye: "#ffffff",
      claw: "#9a9a9a",
    },
    pyrus: {
      id: "pyrus",
      shell: "#ececec",
      shellDeep: "#3a3a3a",
      accent: "#ffffff",
      accentHot: "#fafafa",
      core: "#d4d4d4",
      eye: "#f5f5f5",
      claw: "#b0b0b0",
    },
    darkus: {
      id: "darkus",
      shell: "#6e6e6e",
      shellDeep: "#141414",
      accent: "#d0d0d0",
      accentHot: "#ececec",
      core: "#a8a8a8",
      eye: "#e6e6e6",
      claw: "#888888",
    },
    haos: {
      id: "haos",
      shell: "#f5f5f5",
      shellDeep: "#6a6a6a",
      accent: "#ffffff",
      accentHot: "#fafafa",
      core: "#e8e8e8",
      eye: "#ffffff",
      claw: "#c8c8c8",
    },
    subterra: {
      id: "subterra",
      shell: "#9a9a9a",
      shellDeep: "#2e2e2e",
      accent: "#d8d8d8",
      accentHot: "#efefef",
      core: "#b8b8b8",
      eye: "#eaeaea",
      claw: "#7a7a7a",
    },
    ventus: {
      id: "ventus",
      shell: "#b0b0b0",
      shellDeep: "#242424",
      accent: "#e6e6e6",
      accentHot: "#f5f5f5",
      core: "#cccccc",
      eye: "#ffffff",
      claw: "#8e8e8e",
    },
  };

  const MOODS = new Set([
    "idle", "listening", "thinking", "happy", "excited", "calm",
    "sad", "curious", "fierce", "angry", "mysterious", "amused",
    "surprised", "determined",
  ]);

  const ALIASES = {
    angry: "fierce", mad: "fierce", rage: "fierce",
    neutral: "idle", normal: "idle", joy: "happy", glad: "happy",
    hype: "excited", hyped: "excited", wow: "excited",
    upset: "sad", cry: "sad", shocked: "surprised", shock: "surprised",
    think: "thinking", listen: "listening",
    battle: "determined", brave: "determined", fight: "determined",
  };

  const state = {
    emotion: "idle",
    theme: { ...THEMES.aquos },
    talking: false,
    talkVol: 0,
    listening: false,
    form: "sphere", // sphere | battle
    debug: true,
  };

  const motion = {
    hop: 0, open: 0, openV: 0, shake: 0, droop: 0, bob: 0, spin: 0,
    eye: 0.55, flash: 0, claw: 0, wobble: 0, breath: 0,
    lean: 0, rock: 0, aura: 0, squash: 0, hopPhase: 0, hopPrev: 0,
  };

  const metrics = {
    frames: 0,
    fps: 0,
    fpsWindowStart: performance.now(),
    lastFrameMs: 0,
    dropped: 0,
    reactionMs: null,
    log: [],
  };

  const canvas = document.getElementById("body");
  const ctx = canvas.getContext("2d", { alpha: true });
  const hud = document.getElementById("hud");

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  function normalizeMood(m) {
    if (!m) return "idle";
    const x = String(m).toLowerCase().trim();
    if (ALIASES[x]) return ALIASES[x];
    return MOODS.has(x) ? (x === "angry" ? "fierce" : x) : "curious";
  }

  function setEmotion(mood) {
    const t0 = performance.now();
    const prev = state.emotion;
    state.emotion = normalizeMood(mood);
    // Anime: big feelings snap open; calm/sad prefer sphere
    if (
      state.emotion === "excited" ||
      state.emotion === "fierce" ||
      state.emotion === "determined" ||
      state.emotion === "surprised"
    ) {
      state.form = "battle";
    }
    if (state.emotion === "calm" || state.emotion === "sad" || state.emotion === "idle") {
      state.form = "sphere";
    }
    // Impulse when mood changes (toy spring / jump)
    if (state.emotion !== prev) {
      if (state.emotion === "surprised") {
        motion.openV += 18;
        motion.squash = Math.max(motion.squash, 0.55);
      } else if (state.emotion === "excited") {
        motion.openV += 12;
      } else if (state.emotion === "happy" || state.emotion === "amused") {
        motion.spin += Math.PI * 0.35;
      } else if (state.emotion === "fierce") {
        motion.flash = 1;
      }
    }
    metrics.reactionMs = performance.now() - t0;
    return state.emotion;
  }

  function setTheme(theme) {
    if (typeof theme === "string" && THEMES[theme]) {
      state.theme = { ...THEMES[theme] };
    } else if (theme && typeof theme === "object") {
      state.theme = { ...state.theme, ...theme };
    }
    return state.theme.id || "custom";
  }

  function setTalking(v) {
    if (typeof v === "number") {
      state.talkVol = Math.max(0, Math.min(1, v));
      state.talking = state.talkVol > 0.04;
    } else {
      state.talking = Boolean(v);
      state.talkVol = state.talking ? 0.6 : 0;
    }
  }

  function react(tagged) {
    const m = String(tagged || "").trim().match(/^\[([a-z]+)\]\s*([\s\S]*)$/i);
    if (m) {
      setEmotion(m[1]);
      return { emotion: state.emotion, text: m[2].trim() };
    }
    setEmotion("curious");
    return { emotion: state.emotion, text: String(tagged || "") };
  }

  function targets(emotion, form, listening, talking) {
    const forceOpen = form === "battle" ? 1 : 0;
    let open = forceOpen, droop = 0, eye = 0.55, wobble = listening ? 0.4 : 0.08;
    let claw = 0, hopDrive = 0, hopAmp = 0, shake = 0;
    let lean = listening ? 0.55 : 0, rock = 0.12, aura = 0, openSnap = 0.75;

    switch (emotion) {
      case "happy": case "amused":
        hopDrive = 7.5; hopAmp = 0.85; eye = 1; wobble = 0.2; rock = 0.14; aura = 0.15; break;
      case "excited":
        open = Math.max(open, 1); claw = 1; eye = 1; hopDrive = 5; hopAmp = 0.35;
        aura = 0.45; openSnap = 0.95; rock = 0; break;
      case "determined":
        open = Math.max(open, 1); claw = 0.35; eye = 1; aura = 1; lean = 0.4;
        openSnap = 0.92; rock = 0; break;
      case "fierce":
        shake = 0.55; eye = 0.95; open = Math.max(open, 0.45); lean = 0.7;
        aura = 0.7; rock = 0; break;
      case "sad":
        droop = 1; eye = 0.22; wobble = 0.05; rock = 0.04; lean = -0.12; break;
      case "calm": case "idle":
        eye = 0.5; rock = 0.16; break;
      case "curious":
        eye = 0.8; wobble = 0.25; open = Math.max(open, 0.15); break;
      case "surprised":
        open = Math.max(open, 1); eye = 1; hopDrive = 2; hopAmp = 0.22;
        aura = 0.35; openSnap = 1; rock = 0; break;
      case "listening":
        eye = 0.85; wobble = 0.4; lean = 0.8; open = Math.max(open, 0.12); rock = 0.05; break;
      case "thinking":
        eye = 0.45; wobble = 0.15; lean = -0.08; rock = 0.2; break;
      case "mysterious":
        eye = 0.4; wobble = 0.12; rock = 0.08; break;
      default: break;
    }
    if (talking && open < 0.2) open = Math.max(open, 0.12);
    return { open, droop, eye, wobble, claw, hopDrive, hopAmp, shake, lean, rock, aura, openSnap };
  }

  function hexA(hex, a) {
    const h = hex.replace("#", "");
    const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
    const n = parseInt(full, 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${Math.max(0, Math.min(1, a))})`;
  }

  function draw(w, h) {
    const c = state.theme;
    const m = motion;
    ctx.clearRect(0, 0, w, h);

    const g = ctx.createRadialGradient(w / 2, h * 0.35, 20, w / 2, h * 0.5, Math.max(w, h) * 0.55);
    g.addColorStop(0, hexA(c.accent, 0.14 + m.aura * 0.12));
    g.addColorStop(0.5, hexA(c.shell, 0.08));
    g.addColorStop(1, "transparent");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    if (m.aura > 0.05) {
      const ag = ctx.createRadialGradient(w / 2, h * 0.5, 10, w / 2, h * 0.5, Math.min(w, h) * 0.42);
      ag.addColorStop(0, hexA(c.accentHot, 0.08 * m.aura));
      ag.addColorStop(1, "transparent");
      ctx.fillStyle = ag;
      ctx.fillRect(0, 0, w, h);
    }

    const rockX = Math.sin(m.breath * Math.PI * 2 * 0.45) * m.rock * 14;
    const leanX = m.lean * Math.min(w, h) * 0.035;
    const cx = w / 2 + m.shake * 14 + Math.sin(m.breath * 2.2) * m.wobble * 10 + rockX + leanX;
    const baseY = h * 0.56;
    const hopPx = m.hop * h * 0.1;
    const droopPx = m.droop * h * 0.04;
    const bobPx = m.bob * h * 0.028;
    const cy = baseY - hopPx + droopPx + bobPx;
    const dim = 1 - m.droop * 0.45;
    const breathScale = 1 + Math.sin(m.breath * 2) * 0.012 - m.squash * 0.08;
    const r = Math.min(w, h) * 0.22 * (1 - m.droop * 0.08) * breathScale;

    ctx.fillStyle = `rgba(0,0,0,${0.22 + m.hop * 0.08})`;
    ctx.beginPath();
    ctx.ellipse(cx, baseY + r * 0.95, r * (0.7 - m.hop * 0.15 + m.open * 0.12), r * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();

    const glow = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 1.55);
    glow.addColorStop(0, hexA(c.accent, 0.28 * m.eye * dim));
    glow.addColorStop(0.55, hexA(c.shell, 0.12 * dim));
    glow.addColorStop(1, "transparent");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 1.55, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(m.spin * 0.12 + m.shake * 0.08 + m.lean * 0.08);
    ctx.scale(1 + m.squash * 0.1, 1 - m.droop * 0.12 - m.squash * 0.14);

    if (m.open > 0.08) drawOpen(r, m, c, dim);
    else drawSphere(r, m, c, dim);

    if (m.flash > 0.05) {
      ctx.fillStyle = hexA(c.accentHot, 0.12 * m.flash);
      ctx.beginPath();
      ctx.arc(0, 0, r * 1.05, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSphere(r, m, c, dim) {
    const body = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    body.addColorStop(0, c.accentHot);
    body.addColorStop(0.35, c.shell);
    body.addColorStop(1, c.shellDeep);
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // Panel seams — living toy, not a smooth marble
    ctx.strokeStyle = hexA(c.shellDeep, 0.55);
    ctx.lineWidth = Math.max(1.5, r * 0.028);
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.78, -0.95, 0.95);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-r * 0.12, -r * 0.88);
    ctx.quadraticCurveTo(0, -r * 0.15, r * 0.12, -r * 0.88);
    ctx.stroke();

    // Side gill bars (cyan inserts)
    for (const side of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        const y = -r * 0.15 + i * r * 0.18;
        ctx.fillStyle = hexA(c.accent, (0.55 + m.eye * 0.35) * dim);
        ctx.fillRect(side * r * 0.62 - (side < 0 ? r * 0.16 : 0), y, r * 0.16, r * 0.07);
      }
    }

    // Eye socket (dark recess) — conscious in ball form
    ctx.fillStyle = "#050505";
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.42, r * 0.23, r * 0.15, 0, 0, Math.PI * 2);
    ctx.fill();

    const bright = 0.35 + m.eye * 0.65;
    for (const sx of [-1, 1]) {
      ctx.shadowColor = hexA(c.eye, 0.9 * bright);
      ctx.shadowBlur = 8 + m.eye * 14;
      ctx.fillStyle = hexA(c.eye, bright * dim);
      ctx.beginPath();
      ctx.arc(sx * r * 0.11, -r * 0.42, r * (0.035 + m.eye * 0.015), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Core gem + fang accents (anime sphere face plate)
    const cg = ctx.createRadialGradient(0, r * 0.08, 1, 0, r * 0.12, r * 0.16);
    cg.addColorStop(0, c.accentHot);
    cg.addColorStop(0.45, c.core);
    cg.addColorStop(1, hexA(c.shellDeep, 0.9));
    ctx.fillStyle = cg;
    ctx.shadowColor = hexA(c.core, 0.7 * m.eye * dim);
    ctx.shadowBlur = 12 + m.eye * 10;
    ctx.beginPath();
    ctx.arc(0, r * 0.12, r * 0.16, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = hexA(c.accent, 0.75 * dim);
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + (i / 6) * Math.PI * 2;
      const rr = r * 0.28;
      const x = Math.cos(a) * rr;
      const y = r * 0.12 + Math.sin(a) * rr * 0.55;
      ctx.beginPath();
      ctx.moveTo(x, y - r * 0.04);
      ctx.lineTo(x + r * 0.04, y + r * 0.03);
      ctx.lineTo(x - r * 0.04, y + r * 0.03);
      ctx.closePath();
      ctx.fill();
    }

    ctx.strokeStyle = hexA(c.accent, 0.35 * dim);
    ctx.lineWidth = r * 0.04;
    ctx.beginPath();
    ctx.arc(0, r * 0.05, r * 0.72, 0.3, Math.PI - 0.3);
    ctx.stroke();
  }

  function drawOpen(r, m, c, dim) {
    const o = m.open;
    const bowl = ctx.createLinearGradient(0, 0, 0, r);
    bowl.addColorStop(0, c.shell);
    bowl.addColorStop(1, c.shellDeep);
    ctx.fillStyle = bowl;
    ctx.beginPath();
    ctx.ellipse(0, r * 0.15, r * 0.85, r * 0.55, 0, 0, Math.PI);
    ctx.fill();

    // Inner teal machinery / tooth plate
    ctx.fillStyle = hexA(c.accent, 0.85 * dim);
    ctx.fillRect(-r * 0.28, -r * 0.15, r * 0.56, r * 0.55);
    ctx.strokeStyle = hexA(c.shellDeep, 0.35);
    ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * r * 0.09, -r * 0.05);
      ctx.lineTo(i * r * 0.09, r * 0.32);
      ctx.stroke();
    }

    const flap = 0.75 + o * 1.05;
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.translate(side * r * 0.08, -r * 0.02);
      ctx.rotate(side * flap * (0.95 + m.claw * 0.2 * Math.sin(m.breath * 9)));
      ctx.fillStyle = c.shell;
      ctx.beginPath();
      ctx.moveTo(0, r * 0.05);
      ctx.quadraticCurveTo(side * r * 0.55, -r * 0.75, side * r * 1.15, -r * 0.15);
      ctx.quadraticCurveTo(side * r * 1.05, r * 0.35, side * r * 0.35, r * 0.45);
      ctx.quadraticCurveTo(side * r * 0.12, r * 0.3, 0, r * 0.2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = hexA(c.accent, 0.82 * dim);
      ctx.beginPath();
      ctx.moveTo(side * r * 0.22, -r * 0.05);
      ctx.lineTo(side * r * 0.72, -r * 0.35);
      ctx.lineTo(side * r * 0.68, r * 0.12);
      ctx.lineTo(side * r * 0.2, r * 0.22);
      ctx.closePath();
      ctx.fill();

      const wave = (0.35 + m.claw) * Math.sin(m.breath * 10 + side) * 0.4;
      ctx.translate(side * r * 0.95, -r * 0.05);
      ctx.rotate(side * 0.4 + wave);
      ctx.fillStyle = c.claw;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(side * r * 0.18, r * 0.06);
      ctx.lineTo(side * r * 0.08, r * 0.22);
      ctx.lineTo(-side * r * 0.04, r * 0.12);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Head dome + collar
    ctx.fillStyle = "#0a0a0a";
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.42, r * 0.38, r * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = hexA(c.claw, 0.75);
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.28, r * 0.34, r * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();

    const bright = 0.4 + m.eye * 0.6;
    ctx.shadowColor = hexA(c.eye, 0.95 * bright);
    ctx.shadowBlur = 10 + m.eye * 16;
    for (const sx of [-1, 1]) {
      ctx.fillStyle = hexA(c.eye, bright * dim);
      ctx.beginPath();
      ctx.ellipse(sx * r * 0.12, -r * 0.48, r * 0.045, r * 0.035, sx * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    if (m.open > 0.45) {
      ctx.fillStyle = hexA(c.accent, 0.95 * dim);
      ctx.beginPath();
      ctx.ellipse(0, -r * 0.12, r * 0.28, r * 0.12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = c.shellDeep;
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.moveTo(i * r * 0.07, -r * 0.18);
        ctx.lineTo(i * r * 0.07 + r * 0.03, -r * 0.06);
        ctx.lineTo(i * r * 0.07 - r * 0.03, -r * 0.06);
        ctx.closePath();
        ctx.fill();
      }
    }

    // Teal feet
    ctx.fillStyle = hexA(c.accent, 0.9 * dim);
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sx * r * 0.2, r * 0.55);
      ctx.lineTo(sx * r * 0.38, r * 0.78);
      ctx.lineTo(sx * r * 0.08, r * 0.72);
      ctx.closePath();
      ctx.fill();
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    metrics.lastFrameMs = now - last;
    if (metrics.lastFrameMs > 22) metrics.dropped++;
    last = now;
    metrics.frames++;
    if (now - metrics.fpsWindowStart >= 500) {
      metrics.fps = (metrics.frames * 1000) / (now - metrics.fpsWindowStart);
      metrics.frames = 0;
      metrics.fpsWindowStart = now;
    }

    const m = motion;
    m.breath += dt;
    const t = targets(
      state.emotion,
      state.form,
      state.listening || state.emotion === "listening",
      state.talking,
    );
    const ease = (cur, goal, k) => cur + (goal - cur) * Math.min(1, dt * k);

    // Spring open — anime magnet snap (toy spring), not the same ease as droop
    const K = 420 + t.openSnap * 280;
    const D = 2 * 0.55 * Math.sqrt(K);
    m.openV += (K * (t.open - m.open) - D * m.openV) * dt;
    m.open += m.openV * dt;
    if (m.open < 0) { m.open = 0; m.openV = 0; }
    if (m.open > 1.15) { m.open = 1.15; m.openV *= 0.4; }

    m.droop = ease(m.droop, t.droop, 5);
    m.eye = ease(m.eye, t.eye, 8);
    m.wobble = ease(m.wobble, t.wobble, 6);
    m.claw = ease(m.claw, t.claw, 10);
    m.lean = ease(m.lean, t.lean, 6);
    m.rock = ease(m.rock, t.rock, 4);
    m.aura = ease(m.aura, t.aura, 5);
    m.squash = ease(m.squash, 0, 8);

    if (t.hopDrive > 0) {
      m.hopPhase += dt * (t.hopDrive / (Math.PI * 2));
      const hp = m.hopPhase % 1;
      const hH = Math.abs(Math.sin(Math.PI * hp));
      if (m.hopPrev < 0.05 && hH >= 0.05 && t.hopAmp > 0.2) {
        m.squash = Math.max(m.squash, 0.45 * t.hopAmp);
      }
      m.hopPrev = hH;
      m.hop = hH * t.hopAmp;
    } else {
      m.hop = ease(m.hop, 0, 8);
      m.hopPrev = 0;
    }

    if (t.shake) {
      m.shake = Math.sin(m.breath * 38) * t.shake;
      m.flash = 0.5 + 0.5 * Math.sin(m.breath * 22);
    } else {
      m.shake = ease(m.shake, 0, 12);
      m.flash = ease(m.flash, 0, 6);
    }

    if (state.talking) {
      m.bob = Math.sin(m.breath * 11) * (0.45 + state.talkVol * 0.4)
        + Math.sin(m.breath * 17) * 0.15;
    } else m.bob = ease(m.bob, 0, 7);

    if (state.emotion === "thinking") m.spin += dt * 1.2;
    else if (state.emotion === "happy" || state.emotion === "amused") m.spin *= 1 - Math.min(1, dt * 0.8);
    else m.spin *= 1 - Math.min(1, dt * 2);

    const w = canvas.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || window.innerHeight;
    draw(w, h);

    if (state.debug && hud) {
      hud.textContent =
        `fps ${metrics.fps.toFixed(1)}  drop~${metrics.dropped}\n` +
        `emotion ${state.emotion}  form ${state.form}  open ${m.open.toFixed(2)}\n` +
        `talk ${state.talking ? state.talkVol.toFixed(2) : "off"}  theme ${state.theme.id}\n` +
        `setEmotion react ${metrics.reactionMs != null ? metrics.reactionMs.toFixed(2) + "ms" : "—"}`;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.getElementById("controls").addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    if (btn.dataset.e) {
      if (btn.dataset.e === "listening") state.listening = true;
      else state.listening = false;
      setEmotion(btn.dataset.e);
    }
    if (btn.dataset.a === "react") react("[excited] Whoop — poppin' open!");
    if (btn.dataset.a === "talk") {
      setTalking(true);
      let t = 0;
      const id = setInterval(() => {
        t += 0.05;
        setTalking(0.35 + Math.abs(Math.sin(t * 8)) * 0.55);
        if (t > 2.2) { clearInterval(id); setTalking(false); }
      }, 50);
    }
    if (btn.dataset.a === "theme") {
      const ids = Object.keys(THEMES);
      const i = ids.indexOf(state.theme.id);
      setTheme(ids[(i + 1) % ids.length]);
    }
  });

  const api = {
    setEmotion, setTheme, setTalking, react,
    getState: () => ({ ...state, open: motion.open }),
    getMetrics: () => ({ ...metrics, fps: metrics.fps, droppedApprox: metrics.dropped }),
    setDebug: (v) => { state.debug = Boolean(v); },
  };
  window.BakuganBody = api;
  console.info("[BakuganBody] ready — anime realism", Object.keys(api));
})();
  </script>
</body>
