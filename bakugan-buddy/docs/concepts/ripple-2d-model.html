<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ripple — 2D Model</title>
  <style>
    :root {
      --navy: #030b14;
      --deep: #0b2a8c;
      --shell: #1a4fd6;
      --shell-mid: #2a6ef0;
      --accent: #5dfff0;
      --accent-hot: #9ffff6;
      --core: #3de8ff;
      --claw: #7b5cff;
      --ink: #d8f3ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background:
        radial-gradient(ellipse 80% 60% at 50% 42%, rgba(26, 79, 214, 0.28), transparent 62%),
        radial-gradient(ellipse 50% 40% at 50% 80%, rgba(93, 255, 240, 0.08), transparent 55%),
        var(--navy);
      color: var(--ink);
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      overflow: hidden;
    }
    #stage {
      position: relative;
      width: 100%; height: 100%;
      display: grid;
      place-items: center;
    }
    h1 {
      position: absolute;
      top: clamp(18px, 4vh, 36px);
      left: 0; right: 0;
      margin: 0;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: clamp(14px, 2.2vw, 20px);
      color: var(--accent-hot);
      opacity: 0.9;
      pointer-events: none;
    }
    h1 span {
      display: block;
      margin-top: 6px;
      font-size: 0.72em;
      letter-spacing: 0.28em;
      font-weight: 500;
      color: rgba(168, 197, 212, 0.75);
    }
    .viewport {
      width: min(92vw, 720px);
      aspect-ratio: 1;
      filter: drop-shadow(0 0 28px rgba(61, 232, 255, 0.18));
    }
    .viewport svg { width: 100%; height: 100%; display: block; }
    #controls {
      position: absolute;
      left: 0; right: 0; bottom: 18px;
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      padding: 0 12px;
    }
    #controls button {
      border: 1px solid rgba(93, 255, 240, 0.35);
      background: rgba(26, 79, 214, 0.22);
      color: var(--ink);
      padding: 10px 14px;
      font: 600 12px/1 "Segoe UI", sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    #controls button:hover {
      background: rgba(26, 79, 214, 0.4);
      border-color: var(--accent);
    }
    #controls button.active {
      background: rgba(93, 255, 240, 0.18);
      border-color: var(--accent-hot);
      color: var(--accent-hot);
    }
    #controls button:active { transform: translateY(1px); }

    /* Motion params driven by CSS custom properties */
    .model {
      --open: 0;
      --legs: 0;
      --spin: 0deg;
      --bob: 0px;
      --glow: 0.45;
      transition:
        --open 0.7s cubic-bezier(0.22, 1, 0.36, 1),
        --legs 0.55s cubic-bezier(0.34, 1.3, 0.64, 1),
        --glow 0.5s ease;
    }
    @property --open { syntax: "<number>"; inherits: true; initial-value: 0; }
    @property --legs { syntax: "<number>"; inherits: true; initial-value: 0; }
    @property --glow { syntax: "<number>"; inherits: true; initial-value: 0.45; }

    .model.pose-closed { --open: 0; --legs: 0; --glow: 0.4; }
    .model.pose-open { --open: 1; --legs: 0; --glow: 0.85; }
    .model.pose-deployed { --open: 1; --legs: 1; --glow: 1; }

    .shell-group {
      transform-origin: 200px 200px;
      animation: idle-bob 3.2s ease-in-out infinite;
    }
    @keyframes idle-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .model.spinning .shell-group {
      animation: idle-bob 3.2s ease-in-out infinite, spin-y 8s linear infinite;
    }
    @keyframes spin-y {
      from { transform: rotate(0deg) translateY(0); }
      to { transform: rotate(360deg) translateY(0); }
    }

    .upper-shell { transform-origin: 200px 200px; }
    .lower-shell { transform-origin: 200px 200px; }
    .leg { transform-origin: 200px 200px; opacity: 0; }
    .core-glow { opacity: 0.35; }
    .eye-slit { opacity: 0.2; }

    .ripple-ring {
      fill: none;
      stroke: rgba(93, 255, 240, 0.35);
      stroke-width: 1.5;
      transform-origin: 200px 320px;
      animation: ripple-out 3.6s ease-out infinite;
    }
    .ripple-ring:nth-child(2) { animation-delay: 1.2s; }
    .ripple-ring:nth-child(3) { animation-delay: 2.4s; }
    @keyframes ripple-out {
      0% { transform: scale(0.55); opacity: 0.55; }
      100% { transform: scale(1.35); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <h1>Ripple<span>Aquos 2D model · original</span></h1>
    <div class="viewport">
      <svg viewBox="0 0 400 400" role="img" aria-label="Ripple spherical companion 2D model">
        <defs>
          <radialGradient id="shellGrad" cx="35%" cy="28%" r="70%">
            <stop offset="0%" stop-color="#4a8cff" />
            <stop offset="45%" stop-color="var(--shell)" />
            <stop offset="100%" stop-color="var(--deep)" />
          </radialGradient>
          <radialGradient id="coreGrad" cx="50%" cy="45%" r="55%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="35%" stop-color="var(--accent-hot)" />
            <stop offset="100%" stop-color="var(--core)" />
          </radialGradient>
          <linearGradient id="panelEdge" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--accent-hot)" stop-opacity="0.9" />
            <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.35" />
          </linearGradient>
          <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
          <filter id="coreBloom" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="8" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- floor ripples -->
        <g id="floor" opacity="0.9">
          <ellipse class="ripple-ring" cx="200" cy="320" rx="90" ry="18" />
          <ellipse class="ripple-ring" cx="200" cy="320" rx="90" ry="18" />
          <ellipse class="ripple-ring" cx="200" cy="320" rx="90" ry="18" />
          <ellipse cx="200" cy="320" rx="70" ry="12" fill="none" stroke="rgba(93,255,240,0.22)" stroke-width="1" />
        </g>

        <g class="model pose-closed" id="model">
          <g class="shell-group" id="shellGroup">
            <!-- claw legs -->
            <g class="legs" id="legs">
              <path class="leg" id="legFL" d="M95 195 C70 210 52 245 48 285 L62 288 C68 255 82 228 108 212 Z" fill="url(#shellGrad)" stroke="url(#panelEdge)" stroke-width="1.8" />
              <path class="leg" id="legFR" d="M305 195 C330 210 348 245 352 285 L338 288 C332 255 318 228 292 212 Z" fill="url(#shellGrad)" stroke="url(#panelEdge)" stroke-width="1.8" />
              <path class="leg" id="legBL" d="M110 225 C78 248 62 285 58 318 L74 320 C80 292 94 262 122 242 Z" fill="var(--deep)" stroke="url(#panelEdge)" stroke-width="1.4" />
              <path class="leg" id="legBR" d="M290 225 C322 248 338 285 342 318 L326 320 C320 292 306 262 278 242 Z" fill="var(--deep)" stroke="url(#panelEdge)" stroke-width="1.4" />
            </g>

            <!-- lower hemisphere (full bottom half) -->
            <g class="lower-shell" id="lower">
              <path d="M80 200 A120 120 0 0 0 320 200 Z" fill="url(#shellGrad)" stroke="url(#panelEdge)" stroke-width="1.8" />
              <path d="M110 210 Q200 268 290 210" fill="none" stroke="rgba(93,255,240,0.4)" stroke-width="1.2" />
              <path d="M135 230 Q200 278 265 230" fill="none" stroke="rgba(157,255,246,0.28)" stroke-width="1" />
              <path d="M125 220 L150 285" fill="none" stroke="rgba(93,255,240,0.45)" stroke-width="1.1" />
              <path d="M200 215 L200 310" fill="none" stroke="rgba(93,255,240,0.5)" stroke-width="1.1" />
              <path d="M275 220 L250 285" fill="none" stroke="rgba(93,255,240,0.45)" stroke-width="1.1" />
              <path d="M100 200 L300 200" fill="none" stroke="rgba(159,255,246,0.55)" stroke-width="1.5" />
            </g>

            <!-- core (visible when open) -->
            <g class="core" id="core" filter="url(#coreBloom)">
              <circle class="core-glow" id="coreGlow" cx="200" cy="200" r="48" fill="url(#coreGrad)" />
              <circle cx="200" cy="200" r="30" fill="none" stroke="rgba(159,255,246,0.55)" stroke-width="2" id="ring1" />
              <circle cx="200" cy="200" r="40" fill="none" stroke="rgba(93,255,240,0.3)" stroke-width="1.5" id="ring2" />
              <rect class="eye-slit" id="eye" x="170" y="193" width="60" height="12" rx="6" fill="#061018" stroke="var(--accent-hot)" stroke-width="1.5" />
            </g>

            <!-- upper hemisphere (full top half) -->
            <g class="upper-shell" id="upper">
              <path d="M80 200 A120 120 0 0 1 320 200 Z" fill="url(#shellGrad)" stroke="url(#panelEdge)" stroke-width="1.8" />
              <path d="M135 115 L200 88 L265 115 L282 168 L200 190 L118 168 Z" fill="none" stroke="rgba(93,255,240,0.6)" stroke-width="1.5" />
              <path d="M155 128 L200 108 L245 128 L255 160 L200 176 L145 160 Z" fill="rgba(93,255,240,0.07)" stroke="rgba(159,255,246,0.5)" stroke-width="1.1" />
              <path d="M100 165 L135 115" fill="none" stroke="rgba(93,255,240,0.4)" stroke-width="1.1" />
              <path d="M300 165 L265 115" fill="none" stroke="rgba(93,255,240,0.4)" stroke-width="1.1" />
              <path d="M100 200 L300 200" fill="none" stroke="rgba(159,255,246,0.55)" stroke-width="1.5" />
              <circle cx="155" cy="145" r="3.5" fill="var(--accent)" opacity="0.85" />
              <circle cx="245" cy="145" r="3.5" fill="var(--accent)" opacity="0.85" />
              <circle cx="200" cy="122" r="5" fill="var(--accent-hot)" opacity="0.95" filter="url(#softGlow)" />
            </g>
          </g>
        </g>
      </svg>
    </div>

    <div id="controls">
      <button type="button" data-pose="closed" class="active">Closed</button>
      <button type="button" data-pose="open">Open core</button>
      <button type="button" data-pose="deployed">Deploy</button>
      <button type="button" data-action="spin">Spin</button>
    </div>
  </div>

  <script>
    (function () {
      const model = document.getElementById("model");
      const upper = document.getElementById("upper");
      const lower = document.getElementById("lower");
      const coreGlow = document.getElementById("coreGlow");
      const eye = document.getElementById("eye");
      const ring1 = document.getElementById("ring1");
      const ring2 = document.getElementById("ring2");
      const legs = ["legFL", "legFR", "legBL", "legBR"].map((id) => document.getElementById(id));
      const shellGroup = document.getElementById("shellGroup");

      let open = 0;
      let legsAmt = 0;
      let targetOpen = 0;
      let targetLegs = 0;
      let spinning = false;
      let last = performance.now();

      function lerp(a, b, t) { return a + (b - a) * t; }

      function applyPose() {
        const o = open;
        const l = legsAmt;
        upper.setAttribute("transform", `translate(0, ${-48 * o})`);
        lower.setAttribute("transform", `translate(0, ${28 * o})`);
        coreGlow.setAttribute("opacity", String(0.2 + 0.75 * o));
        eye.setAttribute("opacity", String(0.15 + 0.85 * o));
        ring1.setAttribute("opacity", String(0.15 + 0.7 * o));
        ring2.setAttribute("opacity", String(0.1 + 0.55 * o));
        const scale = 0.55 + 0.45 * o;
        ring1.setAttribute("transform", `translate(200 200) scale(${scale}) translate(-200 -200)`);
        ring2.setAttribute("transform", `translate(200 200) scale(${0.5 + 0.5 * o}) translate(-200 -200)`);

        const spreads = [
          { x: -22, y: 18, r: -18 },
          { x: 22, y: 18, r: 18 },
          { x: -28, y: 26, r: -28 },
          { x: 28, y: 26, r: 28 },
        ];
        legs.forEach((el, i) => {
          const s = spreads[i];
          el.style.opacity = String(Math.min(1, l * 1.2));
          el.setAttribute(
            "transform",
            `translate(${s.x * l} ${s.y * l}) rotate(${s.r * l} 200 200)`
          );
        });
      }

      function loop(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const k = 1 - Math.pow(0.001, dt);
        open = lerp(open, targetOpen, k);
        legsAmt = lerp(legsAmt, targetLegs, k);
        applyPose();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      document.querySelectorAll("#controls button[data-pose]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#controls button[data-pose]").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const pose = btn.getAttribute("data-pose");
          if (pose === "closed") { targetOpen = 0; targetLegs = 0; }
          if (pose === "open") { targetOpen = 1; targetLegs = 0; }
          if (pose === "deployed") { targetOpen = 1; targetLegs = 1; }
          model.className = "model pose-" + pose;
        });
      });

      document.querySelector('[data-action="spin"]').addEventListener("click", (e) => {
        spinning = !spinning;
        e.currentTarget.classList.toggle("active", spinning);
        model.classList.toggle("spinning", spinning);
      });
    })();
  </script>
</body>
</html>
