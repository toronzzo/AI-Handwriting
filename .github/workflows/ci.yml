name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bakugan-buddy:
    name: typecheck · lint · test · packs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            companion/package-lock.json
            bakugan-buddy/studio/package-lock.json
            bakugan-buddy/apps/mobile/package-lock.json

      - name: Character pack schema
        run: node bakugan-buddy/scripts/validate-packs.mjs

      - name: Mood unit tests
        run: npm --prefix bakugan-buddy/packages/mood test

      - name: Body-core unit tests
        run: npm --prefix bakugan-buddy/packages/body-core test

      - name: Emotion-state unit tests
        run: npm --prefix bakugan-buddy/packages/emotion-state test

      - name: Alive behavior unit tests
        run: npm --prefix bakugan-buddy/packages/alive test

      - name: Install mobile
        run: npm ci
        working-directory: bakugan-buddy/apps/mobile

      - name: Typecheck mobile
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: bakugan-buddy/apps/mobile

      - name: Ball clip check
        run: npm run check:ball
        working-directory: bakugan-buddy/apps/mobile

      - name: Install companion
        run: npm ci
        working-directory: companion

      - name: Lint companion
        run: npm run lint
        working-directory: companion

      - name: Typecheck companion
        run: npm run typecheck
        working-directory: companion

      - name: Unit tests companion
        run: npm test
        working-directory: companion

      - name: Build companion
        run: npm run build
        working-directory: companion

      - name: Studio syntax check
        run: |
          node --check bakugan-buddy/studio/server.mjs
          node --check bakugan-buddy/studio/lib/chat.mjs
          node --check bakugan-buddy/studio/lib/tts.mjs
          node --check bakugan-buddy/studio/lib/stt.mjs
          node --check bakugan-buddy/studio/lib/paths.mjs
          node --check bakugan-buddy/studio/lib/prompt.mjs
          node --check bakugan-buddy/evals/mock-llama.mjs
          node --check bakugan-buddy/brain-server/proxy.mjs
          node --check bakugan-buddy/brain-server/lib/select-model.mjs
          bash -n bakugan-buddy/brain-server/setup.sh
          bash -n bakugan-buddy/brain-server/start.sh
          bash -n bakugan-buddy/brain-server/use-model.sh
          bash -n bakugan-buddy/brain-server/lib/ensure-drive.sh
          bash -n bakugan-buddy/brain-server/setup-all.sh
          bash -n bakugan-buddy/brain-server/transcribe.sh
          bash -n bakugan-buddy/brain-server/speak.sh
          node --check bakugan-buddy/brain-server/lib/speech.mjs
          node --experimental-strip-types --disable-warning=ExperimentalWarning --test bakugan-buddy/brain-server/lib/memory.test.mjs

      - name: Install studio (lockfile)
        run: npm ci
        working-directory: bakugan-buddy/studio

      - name: Eval smoke (5 cases, mocked llama)
        run: bash bakugan-buddy/evals/ci-smoke.sh
