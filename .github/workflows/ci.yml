name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bakugan-buddy:
    name: typecheck · lint · test · packs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            companion/package-lock.json
            bakugan-buddy/studio/package-lock.json
            bakugan-buddy/apps/mobile/package-lock.json
            bakugan-buddy/brain-server/package-lock.json

      - name: Character pack schema
        run: node bakugan-buddy/scripts/validate-packs.mjs

      - name: Mood unit tests
        run: npm --prefix bakugan-buddy/packages/mood test

      - name: Body-core unit tests
        run: npm --prefix bakugan-buddy/packages/body-core test

      - name: Emotion-state unit tests
        run: npm --prefix bakugan-buddy/packages/emotion-state test

      - name: Alive behavior unit tests
        run: npm --prefix bakugan-buddy/packages/alive test

      - name: Install mobile
        run: npm ci
        working-directory: bakugan-buddy/apps/mobile

      - name: Typecheck mobile
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: bakugan-buddy/apps/mobile

      - name: Mobile unit tests
        run: npm test
        working-directory: bakugan-buddy/apps/mobile

      - name: Ball clip check
        run: npm run check:ball
        working-directory: bakugan-buddy/apps/mobile

      - name: Install companion
        run: npm ci
        working-directory: companion

      - name: Lint companion
        run: npm run lint
        working-directory: companion

      - name: Typecheck companion
        run: npm run typecheck
        working-directory: companion

      - name: Unit tests companion
        run: npm test
        working-directory: companion

      - name: Build companion
        run: npm run build
        working-directory: companion

      - name: Studio syntax check
        run: |
          node --check bakugan-buddy/studio/server.mjs
          node --check bakugan-buddy/studio/lib/chat.mjs
          node --check bakugan-buddy/studio/lib/tts.mjs
          node --check bakugan-buddy/studio/lib/stt.mjs
          node --check bakugan-buddy/studio/lib/paths.mjs
          node --check bakugan-buddy/studio/lib/prompt.mjs
          node --check bakugan-buddy/evals/mock-llama.mjs
          node --check bakugan-buddy/brain-server/proxy.mjs
          node --check bakugan-buddy/brain-server/lib/chatPipe.mjs
          node --check bakugan-buddy/brain-server/lib/select-model.mjs
          bash -n bakugan-buddy/brain-server/setup.sh
          bash -n bakugan-buddy/brain-server/start.sh
          bash -n bakugan-buddy/launcher/preyas-world.sh
          bash -n bakugan-buddy/brain-server/use-model.sh
          bash -n bakugan-buddy/brain-server/lib/ensure-drive.sh
          bash -c 'source bakugan-buddy/brain-server/lib/ensure-drive.sh
            test "$(gateway_root)" = /Volumes/Agent/agent
            AGENT_DRIVE_ROOT=/Volumes/Agent/BakuganBuddy
            test "$(gateway_root)" = /Volumes/Agent/agent
            unset AGENT_DRIVE_ROOT
            test "$(preyas_data_dir /Volumes/Agent/BakuganBuddy)" = /Volumes/Agent/BakuganBuddy'
          bash -n bakugan-buddy/brain-server/lib/prebuilt-tools.sh
          bash -n bakugan-buddy/brain-server/setup-all.sh
          if grep -nE '^[[:space:]]*brew install' bakugan-buddy/brain-server/*.sh bakugan-buddy/brain-server/lib/*.sh; then
            echo "brain-server must not brew-install; macOS 14 compiles Python 3.15 and fails"
            exit 1
          fi
          bash -n bakugan-buddy/brain-server/transcribe.sh
          bash -n bakugan-buddy/brain-server/speak.sh
          node --check bakugan-buddy/brain-server/lib/speech.mjs
          node --check bakugan-buddy/brain-server/lib/capabilities.mjs
          node --check bakugan-buddy/brain-server/lib/selfKnowledge.mjs
          node --check bakugan-buddy/brain-server/lib/changelog.mjs
          node --check bakugan-buddy/brain-server/lib/power.mjs
          bash -n scripts/preyas.sh
          bash -n scripts/preyas.test.sh
          bash -n scripts/install-desktop-launchers.sh
          bash -n bakugan-buddy/launcher/preyas-on.command
          bash -n bakugan-buddy/launcher/preyas-off.command
          bash -n bakugan-buddy/launcher/preyas-restart.command
          node --experimental-strip-types --disable-warning=ExperimentalWarning --test bakugan-buddy/brain-server/lib/offlineSearch.test.mjs bakugan-buddy/brain-server/lib/providerHealth.test.mjs bakugan-buddy/brain-server/lib/memory.test.mjs bakugan-buddy/brain-server/lib/sampling.test.mjs bakugan-buddy/brain-server/lib/history.test.mjs bakugan-buddy/brain-server/lib/import-paths.test.mjs bakugan-buddy/brain-server/lib/modelSwitch.test.mjs bakugan-buddy/brain-server/lib/chatPipe.test.mjs bakugan-buddy/brain-server/lib/capabilities.test.mjs bakugan-buddy/brain-server/lib/selfKnowledge.test.mjs bakugan-buddy/brain-server/lib/changelog.test.mjs bakugan-buddy/brain-server/lib/power.test.mjs bakugan-buddy/brain-server/lib/coach/skills.test.mjs bakugan-buddy/brain-server/lib/coach/retrieve.test.mjs bakugan-buddy/brain-server/lib/coach/session.test.mjs bakugan-buddy/brain-server/lib/coach/lessons.test.mjs bakugan-buddy/brain-server/lib/coach/escalate.test.mjs bakugan-buddy/brain-server/lib/coach/safety.test.mjs bakugan-buddy/brain-server/lib/art.test.mjs bakugan-buddy/brain-server/lib/activity.test.mjs bakugan-buddy/brain-server/lib/harness/adapter.test.mjs bakugan-buddy/brain-server/lib/harness/estimate.test.mjs bakugan-buddy/brain-server/lib/harness/guard.test.mjs bakugan-buddy/brain-server/lib/harness/runner.test.mjs bakugan-buddy/brain-server/lib/harness/settings.test.mjs bakugan-buddy/brain-server/lib/speech.test.mjs

      - name: Power controller tests (mock processes)
        run: bash scripts/preyas.test.sh

      - name: Install brain-server (MCP servers)
        run: npm ci
        working-directory: bakugan-buddy/brain-server

      - name: Brain OS tests
        run: npm run test:os

      - name: Preyas world sprite export test
        run: npm run test:preyas-world:node

      - name: Preyas world GDScript checks (headless Godot)
        run: |
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64 npm run test:preyas-world:gdscript

      - name: Install studio (lockfile)
        run: npm ci
        working-directory: bakugan-buddy/studio

      - name: Eval smoke (5 cases, mocked llama)
        run: bash bakugan-buddy/evals/ci-smoke.sh
