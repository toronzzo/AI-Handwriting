name: agent-drive

on:
  push:
    branches: [main]
    paths:
      - "tools/agent-drive/**"
      - ".github/workflows/agent-drive.yml"
  pull_request:
    paths:
      - "tools/agent-drive/**"
      - ".github/workflows/agent-drive.yml"

concurrency:
  group: agent-drive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/agent-drive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/agent-drive/requirements.txt

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Pytest
        run: python -m pytest
